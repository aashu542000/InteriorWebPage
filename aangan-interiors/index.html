<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Aangan Interiors – interior design studio in Mumbai. Free consultation on WhatsApp.">
<title>Aangan Interiors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one long scroll — sliding hero "showroom", then services, process, estimator, work, voices, FAQ, consult. Light-only by design. */
:root{
  --chalk:#F5F6F2;      /* page ground, faint sage bias */
  --paper:#FFFFFF;
  --linen:#ECEAE3;      /* soft panels */
  --ink:#1E2824;        /* text, deep olive-black */
  --muted:#5D6A64;
  --sage:#7E9A8B;       /* primary accent */
  --sage-deep:#4F6B5E;
  --oak:#C2925F;        /* warm wood highlight */
  --blush:#EBDCD2;
  --line:#DADDD5;
  --wa:#1FA855;
  --f-display:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:18px;
  color-scheme:light;
}
*{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--chalk);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--chalk)}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sage-deep);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--sage-deep)}
.section{padding-block:88px}
.sec-head{display:grid;gap:14px;max-width:640px;margin-bottom:44px}
.sec-head h2{font-size:clamp(36px,5vw,58px)}
.sec-head p{color:var(--muted);max-width:56ch}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;border:0;cursor:pointer;font-weight:600;text-decoration:none;transition:transform .25s ease,box-shadow .25s ease,background .25s}
.btn:hover{transform:translateY(-2px)}
.btn-ink{background:var(--ink);color:var(--paper)}
.btn-ink:hover{box-shadow:0 12px 28px -12px rgba(30,40,36,.6)}
.btn-ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn-wa{background:var(--wa);color:#fff}
.btn-wa:hover{box-shadow:0 12px 28px -10px rgba(31,168,85,.6)}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(245,246,242,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .3s}
.nav.scrolled{border-color:var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:26px;text-decoration:none}
.logo-mark{width:30px;height:30px;border-radius:50% 50% 4px 50%;background:linear-gradient(135deg,var(--sage),var(--oak));animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.links{display:flex;gap:26px;font-size:14px;font-weight:500}
.links a{text-decoration:none;position:relative}
.links a::after{content:"";position:absolute;left:0;bottom:-4px;height:1.5px;width:100%;background:var(--oak);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.links a:hover::after{transform:scaleX(1)}
.menu-btn{display:none;background:none;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer}
@media (max-width:860px){
  .links{display:none}
  .links.open{display:flex;flex-direction:column;position:absolute;top:100%;left:0;right:0;background:var(--paper);padding:20px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);gap:16px;font-size:17px}
  .menu-btn{display:inline-flex}
  .nav-cta{display:none!important}
}

/* hero */
.hero{padding-block:36px 72px}
.hero-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:44px;align-items:center}
.hero h1{font-size:clamp(46px,7vw,92px)}
.hero h1 em{color:var(--sage-deep)}
.hero-copy{display:grid;gap:22px;min-width:0}
.hero-copy > p{color:var(--muted);font-size:18px;max-width:44ch}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;padding:6px 12px;border-radius:999px;background:var(--paper);border:1px solid var(--line)}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.rise.d1{animation-delay:.08s}.rise.d2{animation-delay:.16s}.rise.d3{animation-delay:.24s}.rise.d4{animation-delay:.32s}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media (max-width:900px){.hero-grid{grid-template-columns:minmax(0,1fr)}}

/* slider */
.slider{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:4/3;max-width:100%;background:var(--linen);box-shadow:0 40px 80px -40px rgba(30,40,36,.45)}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .9s ease}
.slide.on{opacity:1}
.slide > svg,.slide > img{width:100%;height:100%;object-fit:cover;display:block}
.slide.on > svg,.slide.on > img{animation:kb 7s ease-out both}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}
.cap{position:absolute;left:18px;bottom:18px;right:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.cap-card{background:rgba(255,255,255,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:12px 16px;border-radius:14px;max-width:70%}
.cap-card b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.1}
.cap-card span{font-size:13px;color:var(--muted)}
.ctrls{display:flex;gap:8px}
.round{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.9);cursor:pointer;display:grid;place-items:center;font-size:18px;transition:transform .2s}
.round:hover{transform:scale(1.08)}
.dots{position:absolute;top:16px;left:18px;display:flex;gap:6px}
.dot{width:22px;height:4px;border-radius:4px;border:0;background:rgba(255,255,255,.55);cursor:pointer;padding:0;overflow:hidden;position:relative}
.dot.on::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left;animation:fill 5.5s linear both}
.slider.paused .dot.on::after{animation:none;transform:scaleX(1)}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.add-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px;font-size:14px;color:var(--muted)}
.add-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1.5px dashed var(--sage);background:var(--paper);color:var(--sage-deep);font-weight:600;cursor:pointer}
.add-btn input{display:none}
.remove{position:absolute;top:12px;right:14px;border:0;background:rgba(255,255,255,.9);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}

/* marquee */
.marquee{border-block:1px solid var(--line);overflow:hidden;background:var(--paper)}
.mq-track{display:flex;gap:48px;padding-block:18px;width:max-content;animation:mq 38s linear infinite;font-family:var(--f-display);font-size:28px;color:var(--muted)}
.mq-track span{display:flex;align-items:center;gap:48px;white-space:nowrap}
.mq-track span::after{content:"✦";font-size:14px;color:var(--oak)}
@keyframes mq{to{transform:translateX(-50%)}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;padding-block:56px}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(40px,5vw,60px);line-height:1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:14px}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* services */
.svc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.svc{background:var(--paper);border-radius:var(--r);padding:28px;display:grid;gap:12px;align-content:start;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s;border:1px solid var(--line)}
.svc:hover{transform:translateY(-6px);box-shadow:0 24px 48px -28px rgba(30,40,36,.35)}
.svc-ico{width:52px;height:52px;border-radius:14px;background:var(--linen);display:grid;place-items:center;transition:background .3s}
.svc:hover .svc-ico{background:var(--blush)}
.svc h3{font-size:28px}
.svc p{color:var(--muted);font-size:15px}
.svc small{font-size:13px;font-weight:600;color:var(--sage-deep)}
@media (max-width:900px){.svc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.svc-grid{grid-template-columns:minmax(0,1fr)}}

/* process */
.process{background:var(--ink);color:var(--chalk);border-radius:32px;margin-inline:max(8px,env(safe-area-inset-left,0px))}
.process .eyebrow{color:var(--oak)}
.process .sec-head p{color:#B9C3BD}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;counter-reset:s}
.step{border-top:1px solid #3A4842;padding-top:20px;display:grid;gap:8px;align-content:start}
.step i{font-style:normal;font-size:13px;color:var(--oak);font-weight:700;letter-spacing:.1em}
.step h3{font-size:26px}
.step p{font-size:14px;color:#B9C3BD}
.step em{font-style:normal;font-size:12px;color:#8FA197}
@media (max-width:900px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.steps{grid-template-columns:minmax(0,1fr)}}

/* estimator */
.est{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:24px;align-items:stretch}
.est-form{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:28px;display:grid;gap:24px}
.lbl{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:block}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{padding:10px 16px;border-radius:999px;border:1.5px solid var(--line);background:transparent;cursor:pointer;font-size:14px;font-weight:500;transition:all .2s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--sage-deep)}
.range-row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.est-out{background:linear-gradient(160deg,var(--blush),var(--linen));border-radius:24px;padding:28px;display:grid;gap:16px;align-content:space-between}
.est-out .big{font-family:var(--f-display);font-size:clamp(38px,4.6vw,54px);line-height:1;font-variant-numeric:tabular-nums}
.est-out ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px}
.est-out li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed rgba(30,40,36,.18);padding-bottom:8px}
.fine{font-size:12px;color:var(--muted)}
@media (max-width:860px){.est{grid-template-columns:minmax(0,1fr)}}

/* work */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.work{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.tile{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:4/5;max-width:100%;background:var(--linen);animation:pop .5s cubic-bezier(.2,.7,.2,1) both}
.tile svg{width:100%;height:100%;display:block;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.tile:hover svg{transform:scale(1.06)}
.tile-cap{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(255,255,255,.9);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;font-size:13px}
.tile-cap b{font-weight:600}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@media (max-width:860px){.work{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.work{grid-template-columns:minmax(0,1fr)}.tile{aspect-ratio:4/3}}

/* voices */
.voices{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.quote{font-family:var(--f-display);font-size:clamp(28px,3.8vw,44px);line-height:1.15;max-width:28ch;animation:rise .7s both}
.who{margin-top:18px;font-size:14px;color:var(--muted)}
.who b{color:var(--ink)}
.stars{color:var(--oak);letter-spacing:2px}

/* faq */
.faq{display:grid;gap:10px;max-width:820px}
.faq details{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:4px 22px}
.faq summary{cursor:pointer;list-style:none;padding-block:16px;font-weight:600;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:22px;line-height:1;color:var(--sage-deep);transition:transform .3s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding-bottom:18px;color:var(--muted);max-width:65ch}

/* consult */
.consult{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:32px;align-items:start}
.consult-side{display:grid;gap:18px}
.consult-side h2{font-size:clamp(38px,5vw,60px)}
.num{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-variant-numeric:tabular-nums}
.num b{font-size:18px;user-select:all}
.copy{margin-left:auto;border:0;background:var(--linen);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.cform{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:28px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.field{display:grid;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--chalk);transition:border-color .2s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--sage-deep)}
.preview{grid-column:1/-1;font-size:13px;color:var(--muted);background:var(--linen);border-radius:12px;padding:12px 14px;white-space:pre-wrap}
@media (max-width:860px){.consult{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.cform{grid-template-columns:minmax(0,1fr)}}

footer{padding-block:40px;border-top:1px solid var(--line);margin-top:40px;font-size:14px;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px}

/* floating whatsapp */
.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;align-items:center;gap:10px;text-decoration:none}
.fab-bubble{background:var(--paper);border:1px solid var(--line);padding:10px 14px;border-radius:14px 14px 4px 14px;font-size:13px;box-shadow:0 12px 30px -16px rgba(30,40,36,.4);animation:rise .6s 1.2s both}
.fab-btn{width:60px;height:60px;border-radius:50%;background:var(--wa);display:grid;place-items:center;box-shadow:0 14px 30px -10px rgba(31,168,85,.7);position:relative}
.fab-btn::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--wa);animation:ping 2.2s ease-out infinite;z-index:-1}
@keyframes ping{from{transform:scale(1);opacity:.55}to{transform:scale(1.7);opacity:0}}
@media (max-width:560px){.fab-bubble{display:none}}

/* scroll reveal: elements are visible at rest; the class only plays an entrance */
.rv.in{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;z-index:80;animation:rise .3s both}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

/* ---------- Business settings: edit these ---------- */
const WHATSAPP_NUMBER = "919137918782";   // 91 = India country code + 9137918782
const WHATSAPP_DISPLAY = "+91 91379 18782";
const DEFAULT_MESSAGE = "Hi Aangan Interiors! I'd like a free design consultation for my home. Please share the next available slot.";
const waLink = (text = DEFAULT_MESSAGE) => `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`;

/* ---------- Illustrated rooms (placeholders until real photos are added) ---------- */
const PALETTES = {
  living:  { wall:"#E4E9E2", wall2:"#D6DED5", floor:"#D9BC98", main:"#9DB3A6", accent:"#C2925F", rug:"#EBDCD2" },
  bedroom: { wall:"#EFE4DC", wall2:"#E6D6CB", floor:"#CFAE8A", main:"#F7F3EE", accent:"#8BA597", rug:"#DCCFC3" },
  kitchen: { wall:"#E8ECEA", wall2:"#DCE3DF", floor:"#C9B49B", main:"#7E9A8B", accent:"#C2925F", rug:"#ECEAE3" },
  study:   { wall:"#E9E6DD", wall2:"#DDD8CB", floor:"#B98F67", main:"#4F6B5E", accent:"#D6A877", rug:"#E4DDD0" },
  dining:  { wall:"#F0ECE6", wall2:"#E5DED4", floor:"#D4B391", main:"#B9876A", accent:"#7E9A8B", rug:"#EAE2D8" },
};

function Room({ kind = "living", id }) {
  const p = PALETTES[kind];
  const g = `g-${id}`;
  return (
    <svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label={`Illustrated ${kind} interior`}>
      <defs>
        <linearGradient id={`${g}-w`} x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor={p.wall}/><stop offset="1" stopColor={p.wall2}/></linearGradient>
        <linearGradient id={`${g}-l`} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#FFFFFF" stopOpacity=".95"/><stop offset="1" stopColor="#DCE8EE" stopOpacity=".7"/></linearGradient>
        <linearGradient id={`${g}-f`} x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor={p.floor}/><stop offset="1" stopColor="#A9845F"/></linearGradient>
        <radialGradient id={`${g}-glow`} cx=".5" cy=".5" r=".5"><stop offset="0" stopColor="#FFF4DA" stopOpacity=".9"/><stop offset="1" stopColor="#FFF4DA" stopOpacity="0"/></radialGradient>
      </defs>
      <rect width="800" height="600" fill={`url(#${g}-w)`}/>
      <rect y="440" width="800" height="160" fill={`url(#${g}-f)`}/>
      {Array.from({length:9}).map((_,i)=><line key={i} x1={i*100} y1="440" x2={i*100-60} y2="600" stroke="#000" strokeOpacity=".05"/>)}
      <rect y="436" width="800" height="8" fill="#FFFFFF" fillOpacity=".6"/>
      {/* window + light spill */}
      <rect x="520" y="70" width="200" height="260" rx="100" fill={`url(#${g}-l)`} stroke="#FFFFFF" strokeWidth="10"/>
      <line x1="620" y1="70" x2="620" y2="330" stroke="#FFFFFF" strokeWidth="6"/>
      <polygon points="520,330 720,330 800,600 430,600" fill="#FFFFFF" fillOpacity=".18"/>
      {kind === "living" && <>
        <rect x="90" y="110" width="150" height="190" fill="#FFFFFF" stroke={p.accent} strokeWidth="6"/>
        <circle cx="165" cy="190" r="44" fill={p.main}/><rect x="125" y="230" width="80" height="40" fill={p.rug}/>
        <ellipse cx="300" cy="545" rx="260" ry="40" fill={p.rug}/>
        <rect x="70" y="360" width="360" height="110" rx="30" fill={p.main}/>
        <rect x="90" y="320" width="320" height="70" rx="26" fill={p.main} opacity=".85"/>
        <rect x="110" y="380" width="140" height="44" rx="16" fill="#FFFFFF" fillOpacity=".35"/>
        <rect x="260" y="380" width="140" height="44" rx="16" fill="#FFFFFF" fillOpacity=".35"/>
        <rect x="140" y="345" width="56" height="44" rx="12" fill={p.accent}/>

function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll(".rv");
    if (!("IntersectionObserver" in window)) return;
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold:.15 });
    els.forEach(el => { if (el.getBoundingClientRect().top > window.innerHeight) io.observe(el); });
    return () => io.disconnect();
  }, []);
}

function Counter({ to, suffix = "" }) {
  const [n, setN] = useState(to);
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el || !("IntersectionObserver" in window)) return;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const io = new IntersectionObserver(([e]) => {
      if (!e.isIntersecting) return; io.disconnect();
      const t0 = performance.now(), dur = 1400;
      const tick = t => { const k = Math.min(1, (t - t0) / dur); setN(Math.round(to * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(tick); };
      setN(0); requestAnimationFrame(tick);
    }, { threshold:.6 });
    io.observe(el); return () => io.disconnect();
  }, [to]);
  return <b ref={ref}>{n.toLocaleString("en-IN")}{suffix}</b>;
}

function Slider() {
  const [own, setOwn] = useState([]);
  const slides = useMemo(() => [...own, ...SLIDES], [own]);
  const [i, setI] = useState(0);
  const [paused, setPaused] = useState(false);
  useEffect(() => {
    if (paused || slides.length < 2) return;
    const t = setTimeout(() => setI(x => (x + 1) % slides.length), 5500);
    return () => clearTimeout(t);
  }, [i, paused, slides.length]);
  useEffect(() => { if (i >= slides.length) setI(0); }, [slides.length]);
  const go = d => setI(x => (x + d + slides.length) % slides.length);
  const add = e => {
    const files = [...(e.target.files || [])].filter(f => f.type.startsWith("image/"));
    if (!files.length) return;
    const added = files.map(f => ({ src:URL.createObjectURL(f), title:f.name.replace(/\.[^.]+$/, "").replace(/[-_]/g," "), meta:"Your photo", own:true }));
    setOwn(o => [...added, ...o]); setI(0); e.target.value = "";
  };
  const remove = idx => setOwn(o => o.filter((_, k) => k !== idx));
  const s = slides[i] || slides[0];
  return (
    <div className="rise d2" style={{minWidth:0}}>
      <div className={"slider" + (paused ? " paused" : "")} onMouseEnter={() => setPaused(true)} onMouseLeave={() => setPaused(false)} aria-roledescription="carousel" aria-label="Featured interiors">
        {slides.map((sl, k) => (
          <div key={(sl.src || sl.kind) + k} className={"slide" + (k === i ? " on" : "")} aria-hidden={k !== i}>
            {sl.src ? <img src={sl.src} alt={sl.title}/> : <Room kind={sl.kind} id={"s" + k}/>}
          </div>
        ))}
        <div className="dots">{slides.map((_, k) => <button key={k} className={"dot" + (k === i ? " on" : "")} aria-label={`Show slide ${k + 1}`} onClick={() => setI(k)}></button>)}</div>
        {s.own && <button className="remove" onClick={() => remove(i)}>Remove photo</button>}
        <div className="cap">
          <div className="cap-card" key={i}><b className="rise">{s.title}</b><span>{s.meta}</span></div>
          <div className="ctrls">
            <button className="round" aria-label="Previous slide" onClick={() => go(-1)}>←</button>
            <button className="round" aria-label="Next slide" onClick={() => go(1)}>→</button>
          </div>
        </div>
      </div>
      <div className="add-row">
        <label className="add-btn" htmlFor="slide-upload">＋ Add your room photos
          <input id="slide-upload" type="file" accept="image/*" multiple onChange={add}/>
        </label>
        <span>Illustrations shown until your project photos are added.</span>
      </div>
    </div>
  );
}

              <li><span>Area × scope</span><b>{Math.round(area * SCOPES[scope]).toLocaleString("en-IN")} sq ft</b></li>
              <li><span>Design fee</span><b>Included</b></li>
              <li><span>Timeline</span><b>{scope === "Kitchen + wardrobes" ? "21–30 days" : area > 1500 ? "60–75 days" : "45–60 days"}</b></li>
            </ul>
            <a className="btn btn-wa" href={waLink(msg)} target="_blank" rel="noopener"><WaIcon/>Send this estimate on WhatsApp</a>
            <p className="fine">Indicative only. Civil work, appliances and GST are quoted separately after a site visit.</p>
          </div>
        </div>
      </div>
    </section>
  );
}

function Work() {
  const cats = ["All", "Residential", "Kitchens", "Workspaces"];
  const [c, setC] = useState("All");
  const list = WORK.filter(w => c === "All" || w.c === c);
  return (
    <section className="section" id="work" style={{paddingTop:0}}>
      <div className="wrap">
        <div className="sec-head rv"><span className="eyebrow">Recent projects</span><h2>Spaces we've finished lately.</h2></div>
        <div className="filters seg">{cats.map(x => <button key={x} aria-pressed={c === x} onClick={() => setC(x)}>{x}</button>)}</div>
        <div className="work">
          {list.map((w, k) => (
            <figure key={c + w.t} className="tile" style={{margin:0, animationDelay:`${k * 70}ms`}}>
              <Room kind={w.kind} id={"w" + k + c}/>
              <figcaption className="tile-cap"><b>{w.t}</b><span>{w.v}</span></figcaption>
            </figure>
          ))}
        </div>
      </div>
    </section>
  );
}

function Voices() {
  const [i, setI] = useState(0);
  useEffect(() => { const t = setTimeout(() => setI(x => (x + 1) % VOICES.length), 7000); return () => clearTimeout(t); }, [i]);
  const v = VOICES[i];
  return (
    <section className="section" style={{background:"var(--paper)", borderBlock:"1px solid var(--line)"}}>
      <div className="wrap voices">
        <div style={{minWidth:0}}>
          <span className="eyebrow">Client stories</span>
          <p className="stars" style={{marginTop:14}} aria-label="5 out of 5 stars">★★★★★</p>
          <blockquote className="quote" key={i} style={{margin:"10px 0 0"}}>“{v.q}”</blockquote>
          <p className="who"><b>{v.n}</b> · {v.p}</p>
        </div>
        <div className="ctrls">
          <button className="round" style={{background:"var(--linen)"}} aria-label="Previous story" onClick={() => setI((i + VOICES.length - 1) % VOICES.length)}>←</button>
          <button className="round" style={{background:"var(--linen)"}} aria-label="Next story" onClick={() => setI((i + 1) % VOICES.length)}>→</button>
        </div>
      </div>
    </section>
  );
}

function Faq() {
  return (
    <section className="section" id="faq">
      <div className="wrap">
        <div className="sec-head rv"><span className="eyebrow">Good to know</span><h2>Questions clients ask us first.</h2></div>
        <div className="faq">{FAQS.map((f, k) => <details key={k} className="rv" open={k === 0}><summary>{f.q}</summary><p>{f.a}</p></details>)}</div>
      </div>
    </section>
  );
}

function Consult({ toast }) {
  const [f, setF] = useState({ name:"", area:"", space:"2BHK apartment", budget:"₹10–20 lakh", when:"Within 3 months", note:"" });
  const up = k => e => setF({ ...f, [k]:e.target.value });
  const msg = `Hi Aangan Interiors! I'd like a free design consultation.\n` +
    (f.name ? `Name: ${f.name}\n` : "") + (f.area ? `Location: ${f.area}\n` : "") +
    `Space: ${f.space}\nBudget: ${f.budget}\nStart: ${f.when}` + (f.note ? `\nNotes: ${f.note}` : "");
  const copy = () => {
    try { navigator.clipboard.writeText(WHATSAPP_DISPLAY).then(() => toast("Number copied"), () => toast("Select the number to copy it")); }
    catch { toast("Select the number to copy it"); }
  };
  return (
    <section className="section" id="consult">
      <div className="wrap consult">
        <div className="consult-side rv">
          <span className="eyebrow">Free consultation</span>
          <h2>Tell us about your space.</h2>
          <p style={{color:"var(--muted)"}}>Fill in what you know. We'll open WhatsApp with your details already typed, so a designer can reply with ideas and a visit slot, usually within 30 minutes.</p>
          <div className="num"><WaIcon color="var(--wa)"/><b>{WHATSAPP_DISPLAY}</b><button className="copy" onClick={copy}>Copy</button></div>
          <p className="fine">Mon–Sat, 10 am – 8 pm · Studio: Hiranandani Gardens, Powai</p>
        </div>
        <form className="cform rv" onSubmit={e => e.preventDefault()}>
          <div className="field"><label htmlFor="c-name">Your name</label><input id="c-name" value={f.name} onChange={up("name")} placeholder="e.g. Neha Sharma"/></div>
          <div className="field"><label htmlFor="c-area">Locality</label><input id="c-area" value={f.area} onChange={up("area")} placeholder="e.g. Powai, Mumbai"/></div>
          <div className="field"><label htmlFor="c-space">Space</label><select id="c-space" value={f.space} onChange={up("space")}>{["1BHK apartment","2BHK apartment","3BHK apartment","Villa / bungalow","Kitchen only","Office / retail"].map(o => <option key={o}>{o}</option>)}</select></div>
          <div className="field"><label htmlFor="c-budget">Budget</label><select id="c-budget" value={f.budget} onChange={up("budget")}>{["Under ₹5 lakh","₹5–10 lakh","₹10–20 lakh","₹20–40 lakh","₹40 lakh+","Not sure yet"].map(o => <option key={o}>{o}</option>)}</select></div>
          <div className="field full"><label htmlFor="c-when">When do you want to start?</label><select id="c-when" value={f.when} onChange={up("when")}>{["Right away","Within 3 months","3–6 months","Just exploring"].map(o => <option key={o}>{o}</option>)}</select></div>
          <div className="field full"><label htmlFor="c-note">Anything else?</label><textarea id="c-note" rows="3" value={f.note} onChange={up("note")} placeholder="Possession date, style you like, rooms to focus on…"></textarea></div>
          <div className="preview" aria-live="polite"><b style={{color:"var(--ink)"}}>Your WhatsApp message</b>{"\n"}{msg}</div>
          <a className="btn btn-wa" style={{gridColumn:"1/-1", justifyContent:"center"}} href={waLink(msg)} target="_blank" rel="noopener"><WaIcon/>Send on WhatsApp</a>
        </form>
      </div>
    </section>
  );
}

function App() {
  const [msg, setMsg] = useState("");
  const toast = m => { setMsg(m); setTimeout(() => setMsg(""), 2200); };
  useReveal();
  return (
    <>
      <Nav/>
      <main>
        <Hero/>
        <Marquee/>
        <Stats/>
        <Services/>
        <Process/>
        <Estimator/>
        <Work/>
        <Voices/>
        <Faq/>
        <Consult toast={toast}/>
      </main>
      <footer><div className="wrap foot">
        <span><b style={{color:"var(--ink)", fontFamily:"var(--f-display)", fontSize:22, fontWeight:400}}>Aangan Interiors</b> · Design · Build · Style</span>
        <span>WhatsApp {WHATSAPP_DISPLAY} · © 2026</span>
      </div></footer>
      <a className="fab" href={waLink()} target="_blank" rel="noopener" aria-label="Chat with a design consultant on WhatsApp">
        <span className="fab-bubble">Hi! Need help with your home? 👋</span>
        <span className="fab-btn"><WaIcon size={30}/></span>
      </a>
      {msg && <div className="toast" role="status">{msg}</div>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
